name: Build Erosion IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disable broken KeypadView
        run: |
          cat > Erosion/Tweaks/KeypadView.swift <<'EOF'
          import SwiftUI
          // Keypad UI disabled for this build.
          // We only need Erosion's File Browser / bad_query functionality.
          EOF

      - name: Build IPA
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-IPA
          path: Erosion.ipa
          if-no-files-found: error
