name: Build Erosion IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stub broken KeypadView
        run: |
          cat > Erosion/Tweaks/KeypadView.swift <<'EOF'
          import SwiftUI

          struct KeypadView: View {
              var body: some View {
                  Text("Dialer Themer disabled in this build")
                      .navigationTitle("Dialer Themer")
              }
          }
          EOF

      - name: Add App Bundles browser
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Erosion/FMRootView.swift")
          s = p.read_text()

          needle = 'NavigationLink("Applications", destination: FileBrowserView(path: FSURL.appContainers, isContainer: true))'

          replacement = needle + '''
                      NavigationLink("App Bundles", destination: FileBrowserView(path: URL(fileURLWithPath: FSPaths.appBundles), shouldGrant: true))'''

          if needle not in s:
              print(s)
              raise SystemExit("Applications line not found")

          s = s.replace(needle, replacement, 1)
          p.write_text(s)

          print("App Bundles entry added successfully")
          PY

      - name: Build IPA
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-IPA
          path: Erosion.ipa
          if-no-files-found: error
