name: Build Erosion IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stub broken KeypadView
        run: |
          cat > Erosion/Tweaks/KeypadView.swift <<'EOF'
          import SwiftUI

          struct KeypadView: View {
              var body: some View {
                  Text("Dialer Themer disabled in this build")
                      .navigationTitle("Dialer Themer")
              }
          }
          EOF

      - name: Add App Bundles browser
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Erosion/FMRootView.swift")
          s = p.read_text()

          old = '''NavigationLink("Applications", destination: FileBrowserView(path: FSURL.appContainers, isContainer: true))

                      NavigationLink("Daemons", destination: FileBrowserView(path: FSURL.internalDaemons, isContainer: true))'''

          new = '''NavigationLink("Applications", destination: FileBrowserView(path: FSURL.appContainers, isContainer: true))

                      NavigationLink("App Bundles", destination: FileBrowserView(path: URL(fileURLWithPath: FSPaths.appBundles), shouldGrant: true))

                      NavigationLink("Daemons", destination: FileBrowserView(path: FSURL.internalDaemons, isContainer: true))'''

          if old not in s:
              raise SystemExit("Could not find insertion point")

          p.write_text(s.replace(old, new, 1))
          PY

      - name: Build IPA
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Erosion-IPA
          path: Erosion.ipa
          if-no-files-found: error
